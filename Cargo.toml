[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/node",
  "crates/web"
]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/HeliosLang/groth16"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
